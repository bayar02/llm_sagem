# ─────────────────────────────────────────────────────────────
#  Configuration SERVEUR — nginx existant
#  Ajouter ce bloc pour router vers le container ICP-MTP
#  sans toucher à l'application déjà en place sur le port 443.
#
#  Scénario : port 443 déjà utilisé par nginx (app existante)
#             Container tourne sur le port HOST 8443
#             L'app existante reste intacte sur son virtual host
# ─────────────────────────────────────────────────────────────

# ── Option A : Routing par NOM DE DOMAINE (recommandé) ──────
# Créer un fichier /etc/nginx/sites-available/icp-mtp
# et l'activer avec : ln -s /etc/nginx/sites-available/icp-mtp
#                           /etc/nginx/sites-enabled/icp-mtp

server {
    listen      443 ssl;
    listen      [::]:443 ssl;

    # ⚠️  Remplacer par le vrai FQDN du serveur ICP-MTP
    server_name icp-mtp.votredomaine.com;

    # Utiliser les mêmes certificats que l'app existante
    # (ou un certificat wildcard *.votredomaine.com)
    ssl_certificate     /etc/letsencrypt/live/votredomaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votredomaine.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    # ── Proxy vers le container (port HOST 8443 → container 443) ──
    location / {
        proxy_pass         https://127.0.0.1:8443;
        proxy_http_version 1.1;

        # WebSocket nécessaire pour Streamlit
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Certificat auto-signé du container → ignorer la vérification interne
        proxy_ssl_verify off;

        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        client_max_body_size  200m;
    }
}

# ── Option B : Routing par CHEMIN (si même domaine) ─────────
# Si vous ne pouvez pas créer de sous-domaine, ajoutez ce bloc
# DANS le server{} existant sur port 443 :
#
#   location /icp-mtp/ {
#       proxy_pass         https://127.0.0.1:8443/;
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade    $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_set_header Host       $host;
#       proxy_ssl_verify   off;
#       proxy_read_timeout 300s;
#       client_max_body_size 200m;
#   }
#
# L'app sera accessible sur : https://votredomaine.com/icp-mtp/
# ⚠️  Streamlit nécessite aussi --server.baseUrlPath=/icp-mtp
#     (à ajouter dans entrypoint.sh)
