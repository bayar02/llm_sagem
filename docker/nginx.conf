# ─────────────────────────────────────────────────────────────
#  Nginx — reverse proxy HTTPS → Streamlit
# ─────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    # Logs
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Serveur HTTPS 443 ─────────────────────────────────────
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name _;

        # Certificats (auto-signés par défaut, surchargeables par volume)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Protocoles modernes uniquement
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Proxy vers Streamlit (127.0.0.1:8501) ────────────
        location / {
            proxy_pass         http://127.0.0.1:8501;
            proxy_http_version 1.1;

            # WebSocket (nécessaire pour Streamlit)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Headers standard
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Timeouts (analyses longues)
            proxy_read_timeout    300s;
            proxy_connect_timeout  10s;
            proxy_send_timeout    300s;

            # Taille des uploads (PDFs, logs)
            client_max_body_size 200m;
        }

        # ── Endpoint healthcheck interne ──────────────────────
        location /_health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Redirection HTTP → HTTPS (port 80) ───────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
