name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  import-and-structure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run import/structure tests
        run: |
          pytest -q tests/test_imports.py
